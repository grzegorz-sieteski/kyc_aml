# A rule that matches no classes must FAIL, not pass silently.
#
# Leaving this false would be worse than having no rules at all, because a typo in a package name
# ("..domian..") turns a rule into a green test that checks nothing, and you will trust it.
#
# The repository starts with the shared kernel only. ArchitectureRulesTest therefore carries only
# rules that match classes which exist today. The rules for a business module (domain purity, use
# case shape, aggregate visibility) are added by @test-designer in the RED stage of the first
# module, together with the module itself, so that each one matches something from its first run.
#
# Note the one leak this setting cannot protect you from: ArchUnit reads bytecode, and javac
# inlines compile-time constants, so a cross-package dependency that is only a `static final`
# primitive or String is invisible to every rule here.
archRule.failOnEmptyShould=true
