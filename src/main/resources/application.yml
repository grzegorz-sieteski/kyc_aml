spring:
  application:
    name: kyc-aml

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/service}
    username: ${DATABASE_USERNAME:service}
    # No default: a missing password must fail startup, not fall back to a known credential.
    password: ${DATABASE_PASSWORD}

  # Two roles (D-11). Flyway migrates as the schema owner, with no defaults: a missing owner must fail
  # startup. The service connects as DATABASE_USERNAME, which owns nothing; the migrations grant it its
  # rights through the placeholder service_role, set from the service's connection in
  # RiskDatabaseConfiguration. Under @ServiceConnection the container supplies Flyway's credentials.
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}

  # No route accepts multipart (R-21). Without a MultipartResolver, DispatcherServlet parses no part
  # before a handler runs, so an unidentified caller cannot make the service read and store a body.
  servlet:
    multipart:
      enabled: false

  # No FormContentFilter (R-22): it would read a whole PUT/PATCH/DELETE form body, unbounded, before
  # dispatch and so before identification. No route accepts a form body.
  mvc:
    formcontent:
      filter:
        enabled: false

  # The identity source (D-13, design addendum 2026-11-09 (3)): JWT bearer tokens of the bank's identity
  # provider. No defaults: a missing value must fail startup, never fall back to a guessed issuer or key set.
  # The keys come from jwk-set-uri, so the issuer is only validated, never used for discovery at startup.
  # For Entra ID: ISSUER_URI https://login.microsoftonline.com/<tenant>/v2.0, TOKEN_AUDIENCE the app's
  # client id or App ID URI, JWK_SET_URI https://login.microsoftonline.com/<tenant>/discovery/v2.0/keys.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI}
          audiences: ${TOKEN_AUDIENCE}
          jwk-set-uri: ${JWK_SET_URI}
          jws-algorithms: RS256

  # Spring Boot 4 reads the error settings here; server.error.* is no longer bound. The answer itself
  # comes from ContainerErrorResource, which never includes any of these (R-08): this is a second guard.
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-path: never

app:
  # Which token claims name the caller (D-14): configuration, so the identity provider's setup can change
  # without a release. The defaults are the Entra ID names; each role's value is exactly an ActorRole name.
  identity:
    actor-claim: oid
    role-claim: roles
    booking-centre-claim: booking_centre

  outbox:
    relay:
      batch-size: 100
      # How long a relay owns the rows it claimed. Much longer than the slowest chunk (a few hundred
      # milliseconds); it is also the worst-case delay before another relay takes over after a crash.
      lease: PT30S
      # Connections the relay may use at once. Default: half the pool, never fewer than two.
      # connection-budget: 5
      poll-interval: PT1S

logging:
  level:
    org.springframework.jdbc.core: INFO
