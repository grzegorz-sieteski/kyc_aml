spring:
  application:
    name: kyc-aml

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/service}
    username: ${DATABASE_USERNAME:service}
    # No default: a missing password must fail startup, not fall back to a known credential.
    password: ${DATABASE_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  outbox:
    relay:
      batch-size: 100
      # How long a relay owns the rows it claimed. Much longer than the slowest chunk (a few hundred
      # milliseconds); it is also the worst-case delay before another relay takes over after a crash.
      lease: PT30S
      # Connections the relay may use at once. Default: half the pool, never fewer than two.
      # connection-budget: 5
      poll-interval: PT1S

logging:
  level:
    org.springframework.jdbc.core: INFO

server:
  error:
    include-message: never
    include-stacktrace: never
