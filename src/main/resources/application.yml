spring:
  application:
    name: kyc-aml

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/service}
    username: ${DATABASE_USERNAME:service}
    # No default: a missing password must fail startup, not fall back to a known credential.
    password: ${DATABASE_PASSWORD}

  # Two roles (D-11). Flyway migrates as the schema owner, with no defaults: a missing owner must fail
  # startup. The service connects as DATABASE_USERNAME, which owns nothing; the migrations grant it its
  # rights through the placeholder service_role, set from the service's connection in
  # RiskDatabaseConfiguration. Under @ServiceConnection the container supplies Flyway's credentials.
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}

  # Spring Boot 4 reads the error settings here; server.error.* is no longer bound. The answer itself
  # comes from ContainerErrorResource, which never includes any of these (R-08): this is a second guard.
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-path: never

app:
  outbox:
    relay:
      batch-size: 100
      # How long a relay owns the rows it claimed. Much longer than the slowest chunk (a few hundred
      # milliseconds); it is also the worst-case delay before another relay takes over after a crash.
      lease: PT30S
      # Connections the relay may use at once. Default: half the pool, never fewer than two.
      # connection-budget: 5
      poll-interval: PT1S

logging:
  level:
    org.springframework.jdbc.core: INFO
